name: 构建 iOS 安装包

on:
  workflow_dispatch:   # 手动触发：仓库页面 → Actions → 本工作流 → Run workflow
  push:
    branches: [main, master]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --omit=dev --no-audit --no-fund

      - name: 构建 Web 资源（生成 www/ 并注入 Capacitor 运行时）
        run: node build.js

      - name: 同步 Capacitor iOS 工程（含 pod install）
        run: npx cap sync ios

      - name: 验证蓝牙扫描补丁已生效（node_modules 与 Pods 双重检查）
        run: |
          echo "=== node_modules 补丁状态 ==="
          grep -n "isEmpty ? nil" node_modules/@capacitor-community/bluetooth-le/ios/Plugin/DeviceManager.swift && echo "OK: node_modules 已补丁" || (echo "FAIL: node_modules 未补丁" && exit 1)
          echo "=== Pods 编译源码补丁状态 ==="
          find ios/App/Pods -name "DeviceManager.swift" -path "*bluetooth*" 2>/dev/null | while read f; do
            echo "检查: $f"
            grep -q "isEmpty ? nil" "$f" && echo "  OK: 已补丁" || echo "  FAIL: 未补丁（这是编译实际用的源码！）"
          done

      - name: 编译并打包未签名 IPA
        run: |
          cd ios/App
          rm -rf build Payload App.ipa
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
          mkdir -p Payload
          cp -R "build/App.xcarchive/Products/Applications/App.app" Payload/
          zip -qry App.ipa Payload
          echo "=== IPA 信息 ==="
          ls -lh App.ipa

      - name: 上传 IPA 供下载
        uses: actions/upload-artifact@v4
        with:
          name: 魔方小将-ipa
          path: ios/App/App.ipa
          retention-days: 14
