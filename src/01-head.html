<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="魔方小将">
<meta name="theme-color" content="#3a7afe">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>魔方小将 · CFOP 训练营</title>
<style>
  :root{
    --bg:#eef3fb; --card:#ffffff; --ink:#1f2a3d; --sub:#6b7689;
    --blue:#3a7afe; --blue2:#6aa0ff; --blue-l:#e8f0ff;
    --yellow:#ffc400; --red:#ff5a6e; --green:#16c079; --purple:#8b5cf6; --orange:#ff8a3d;
    --line:#e4ebf6; --shadow:0 8px 24px rgba(40,70,130,.10);
    --cell:30px;            /* 平面视图格子尺寸 */
    --cellbig:34px;
    --radius:20px;
    --tabh:66px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;}

  /* ---------- 顶部栏 ---------- */
  .topbar{
    position:sticky; top:0; z-index:60;
    display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:linear-gradient(120deg,#3a7afe,#6aa0ff 60%,#8b5cf6);
    color:#fff; box-shadow:0 3px 14px rgba(58,122,254,.28);
  }
  .topbar .back{
    border:none; background:rgba(255,255,255,.22); color:#fff;
    width:38px; height:38px; border-radius:12px; font-size:22px; line-height:1;
    display:none; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
  }
  .topbar .back.show{display:flex;}
  .topbar .ttl{font-size:19px; font-weight:800; letter-spacing:.3px; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .stars{
    background:rgba(255,255,255,.2); border-radius:999px; padding:6px 12px;
    font-size:14px; font-weight:800; white-space:nowrap;
  }

  /* ---------- 页面容器 ---------- */
  main{padding-bottom:calc(var(--tabh) + 26px + env(safe-area-inset-bottom));}
  .page{display:none; max-width:880px; margin:0 auto; padding:16px 14px 20px;}
  .page.active{display:block; animation:fade .22s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  h1{font-size:23px; margin:8px 0 4px; letter-spacing:.2px;}
  h2{font-size:19px; margin:20px 0 10px; display:flex; align-items:center; gap:8px;}
  h3{font-size:17px; margin:0 0 8px;}
  .lead{color:var(--sub); font-size:15px; line-height:1.75; margin:6px 0 12px;}
  .sub{color:var(--sub); font-size:13.5px;}
  .center{text-align:center;}
  .hidden{display:none !important;}

  /* ---------- 卡片 / 按钮 ---------- */
  .card{background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); margin:12px 0;}
  .card.tight{padding:12px;}
  .btn{
    border:none; border-radius:14px; padding:12px 16px; font-size:15.5px; font-weight:800;
    background:var(--blue); color:#fff; cursor:pointer; min-height:46px;
    box-shadow:0 4px 12px rgba(58,122,254,.26); transition:transform .12s, box-shadow .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn.alt{background:var(--blue-l); color:var(--blue); box-shadow:none;}
  .btn.green{background:var(--green); box-shadow:0 4px 12px rgba(22,192,121,.26);}
  .btn.yellow{background:var(--yellow); color:#5a4500; box-shadow:0 4px 12px rgba(255,196,0,.3);}
  .btn.red{background:var(--red); box-shadow:0 4px 12px rgba(255,90,110,.26);}
  .btn.ghost{background:#fff; color:var(--sub); border:2px solid var(--line); box-shadow:none;}
  .btn.sm{padding:8px 12px; font-size:14px; min-height:38px; border-radius:11px;}
  .btn:disabled{opacity:.42; cursor:not-allowed; box-shadow:none;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .row.center{justify-content:center;}
  .pill{display:inline-block; padding:4px 11px; border-radius:999px; font-size:12.5px; font-weight:800;
    background:var(--blue-l); color:var(--blue);}
  .pill.y{background:#fff4cc; color:#8a6500;}
  .pill.g{background:#e3f9ef; color:#0a8f57;}
  .pill.r{background:#ffe8ec; color:#d62841;}
  .pill.p{background:#f1eaff; color:#6d3bdd;}
  .bar{height:11px; background:#e9eefa; border-radius:9px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; border-radius:9px;
    background:linear-gradient(90deg,var(--blue),var(--blue2)); transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .warn{background:#fff7e6; border:1px solid #ffe0a3; color:#8a5a00; border-radius:14px; padding:12px 14px; font-size:14px; line-height:1.7;}
  .okbox{background:#e9fbf2; border:1px solid #a8ecc9; color:#0a7a4b; border-radius:14px; padding:12px 14px; font-size:14px; line-height:1.7;}
  .divider{height:1px; background:var(--line); margin:14px 0;}

  /* ---------- 底部标签栏 ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:70;
    display:flex; background:rgba(255,255,255,.96); backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 18px rgba(40,70,130,.07);
  }
  .tabbar button{
    flex:1; border:none; background:none; cursor:pointer; color:var(--sub);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    font-size:11px; font-weight:700; padding:6px 0; border-radius:12px;
  }
  .tabbar button .ic{font-size:21px; line-height:1.1;}
  .tabbar button.on{color:var(--blue); background:var(--blue-l);}

  /* ---------- 3D 轴测视图 ---------- */
  .viewwrap{
    background:linear-gradient(180deg,#f7faff,#eef4ff);
    border-radius:16px; padding:8px; position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .cube3d{width:100%; height:auto; display:block; touch-action:none; max-width:330px;}
  .cube3d polygon{stroke:#1b2436; stroke-width:1.6; stroke-linejoin:round; transition:fill .12s;}
  .cube3d .pulse{animation:pulse 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes pulse{0%,100%{opacity:.35;} 50%{opacity:1;}}
  .viewhint{position:absolute; right:8px; bottom:6px; font-size:11px; color:#9aa6ba;}
  .viewctrl{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  .viewctrl button{
    border:1px solid var(--line); background:#fff; border-radius:10px;
    padding:6px 10px; font-size:12.5px; font-weight:700; color:var(--sub); cursor:pointer;
  }
  .viewctrl button:active{background:var(--blue-l); color:var(--blue);}

  /* ---------- 平面视图：6 个独立面 ---------- */
  .planar{display:grid; grid-template-columns:repeat(3,1fr); gap:14px 8px; justify-items:center;}
  .pface{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .pface .lb{font-size:12.5px; font-weight:800; color:var(--sub); letter-spacing:.5px;}
  .pface .lb em{font-style:normal; color:#9aa6ba; font-weight:600;}
  .facegrid{display:grid; grid-template-columns:repeat(3,var(--cell)); grid-template-rows:repeat(3,var(--cell)); gap:3px;}
  .facegrid i{display:block; border-radius:4px; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.17);}
  .facegrid i.dim{opacity:.22;}

  /* ---------- 识别图：顶面 + 四侧条 ---------- */
  .chart{display:grid; grid-template-columns:repeat(3,auto); justify-content:center; gap:7px;
    align-items:center; padding:10px 4px;}
  .chart .c3{display:grid; grid-template-columns:repeat(3,var(--cell)); gap:3px;}
  .chart .strip{display:grid; gap:3px;}
  .chart .strip.h{grid-template-columns:repeat(3,var(--cell)); grid-auto-rows:var(--cell);}
  .chart .strip.v{grid-template-rows:repeat(3,var(--cell)); grid-auto-columns:var(--cell);}
  .chart .cellbox{width:var(--cell); height:var(--cell); border-radius:4px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.10);}
  .chart .uu{transform:scale(1.02);}
  .chart .corner{width:var(--cell); height:var(--cell);}
  .chart-label{text-align:center; font-size:12px; color:var(--sub); font-weight:700; margin-top:2px;}
  .chart-legend{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--sub); margin-top:6px;}
  .chart-legend span{display:inline-flex; align-items:center; gap:5px;}
  .chart-legend i{width:13px; height:13px; border-radius:4px; display:inline-block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed; inset:0; z-index:100; background:rgba(18,28,46,.55);
    display:none; align-items:flex-end; justify-content:center;}
  .modal.show{display:flex;}
  .sheet{
    background:#fff; width:100%; max-width:900px; max-height:94vh; overflow-y:auto;
    border-radius:24px 24px 0 0; padding:16px 16px calc(26px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch;
  }
  @media(min-width:900px){
    .modal{align-items:center;}
    .sheet{border-radius:24px; max-height:90vh;}
  }
  .sheet-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .sheet-head h3{flex:1; margin:0; font-size:20px; line-height:1.3;}
  .closex{border:none; background:#f1f5fc; color:var(--sub); width:36px; height:36px; border-radius:12px;
    font-size:20px; cursor:pointer; flex:0 0 auto;}

  /* 双视图并排 */
  .duo{display:grid; grid-template-columns:1fr; gap:14px;}
  @media(min-width:720px){ .duo{grid-template-columns:1.05fr 1fr;} }
  .panel{background:#f8fbff; border:1px solid var(--line); border-radius:16px; padding:10px;}
  .panel .ptitle{font-size:13px; font-weight:800; color:var(--blue); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
  .panel .ptitle b{background:var(--blue); color:#fff; border-radius:6px; padding:1px 6px; font-size:11px;}

  /* 分段跟练 */
  .chunks{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 6px;}
  .chunk{
    padding:10px 14px; border-radius:12px; background:#eef3ff; color:var(--blue);
    font-weight:800; font-size:16px; cursor:pointer; border:2px solid transparent;
    font-family:ui-monospace,Menlo,monospace; letter-spacing:.5px;
  }
  .chunk.done{background:var(--green); color:#fff;}
  .chunk.now{border-color:var(--blue); background:#fff; box-shadow:0 0 0 3px rgba(58,122,254,.15);}

  /* 讲解块 */
  .talk{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
  .talk .t{background:#f7faff; border-radius:14px; padding:11px 13px; font-size:15px; line-height:1.72;}
  .talk .t b.k{display:inline-block; background:#fff3d6; color:#8a6500; border-radius:7px;
    padding:1px 8px; font-size:12.5px; margin-right:6px; vertical-align:2px;}
  .talk .t.story{background:#f3eeff;}
  .talk .t.story b.k{background:#e6dbff; color:#6d3bdd;}

  /* 公式卡片网格 */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px;}
  .gcard{
    background:#fff; border:2px solid var(--line); border-radius:16px; padding:8px 4px 6px;
    text-align:center; cursor:pointer; transition:.15s; position:relative;
  }
  .gcard:active{transform:scale(.97);}
  .gcard:hover{border-color:var(--blue2);}
  .gcard .no{font-weight:800; font-size:14px; color:var(--ink);}
  .gcard .lb{font-size:11px; color:var(--sub); margin-top:1px; height:14px; overflow:hidden;}
  .gcard canvas,.gcard .mini3d{display:block; margin:4px auto 2px;}
  .gcard.star::after{content:"⭐"; position:absolute; top:-7px; right:-4px; font-size:15px;}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin:10px 0;}
  .chip{font-size:13px; padding:7px 13px; border-radius:999px; border:1.5px solid var(--line);
    background:#fff; cursor:pointer; color:var(--sub); font-weight:700;}
  .chip.on{background:var(--blue); color:#fff; border-color:var(--blue);}

  /* 选项 */
  .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;}
  @media(min-width:600px){ .opts{grid-template-columns:repeat(3,1fr);} }
  .opt{
    padding:13px 10px; border-radius:14px; border:2px solid var(--line); background:#fff;
    cursor:pointer; font-weight:800; font-size:15px; text-align:center; color:var(--ink);
    transition:.14s;
  }
  .opt:active{transform:scale(.97);}
  .opt.ok{background:var(--green); color:#fff; border-color:var(--green);}
  .opt.no{background:var(--red); color:#fff; border-color:var(--red);}
  .opt .mono{font-family:ui-monospace,Menlo,monospace; font-size:14px;}

  /* 对比教学 */
  .cmp-row{display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:stretch;}
  .cmp-col{background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:9px 10px; text-align:center;}
  .cmp-col.mine{border-color:var(--blue2); box-shadow:0 0 0 3px rgba(58,122,254,.10);}
  .cmp-h{font-size:12px; font-weight:900; color:var(--sub); margin-bottom:4px;}
  .cmp-col.mine .cmp-h{color:var(--blue);}
  .cmp-alg{font-size:13.5px; font-weight:800; letter-spacing:.3px; word-break:break-all; line-height:1.5;}
  .cmp-sub{font-size:10.5px; color:#9aa6ba; margin-top:3px; height:14px; overflow:hidden;}
  .cmp-mid{display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--purple);}
  .masked{filter:blur(16px) saturate(.15); transition:filter .18s;}
  @media(max-width:420px){ .cmp-alg{font-size:12px;} }

  /* 进度点 */
  .dots{display:flex; gap:6px; justify-content:center; margin:10px 0;}
  .dots i{width:9px; height:9px; border-radius:50%; background:#dbe4f3; display:block;}
  .dots i.on{background:var(--blue);}
  .dots i.ok{background:var(--green);}
  .dots i.bad{background:var(--red);}

  /* 闯关地图 */
  .stage{margin:16px 0; border-radius:20px; overflow:hidden; box-shadow:var(--shadow); background:#fff;}
  .stage-head{padding:14px 16px; color:#fff; display:flex; align-items:center; gap:10px;}
  .stage-head .em{font-size:26px;}
  .stage-head .nm{font-size:18px; font-weight:800; flex:1;}
  .stage-head .pg{font-size:13px; background:rgba(255,255,255,.24); padding:4px 10px; border-radius:999px; font-weight:700;}
  .stage-1 .stage-head{background:linear-gradient(120deg,#1fa971,#5ed39a);}
  .stage-2 .stage-head{background:linear-gradient(120deg,#4a6fd8,#8aa9f5);}
  .stage-3 .stage-head{background:linear-gradient(120deg,#8b5cf6,#c084fc);}
  .levels{padding:12px; display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px;}
  .lv{
    border:2px solid var(--line); border-radius:16px; padding:10px 6px; text-align:center;
    cursor:pointer; background:#fff; position:relative; transition:.15s;
  }
  .lv:active{transform:scale(.97);}
  .lv .n{font-weight:900; font-size:17px;}
  .lv .nm2{font-size:11px; color:var(--sub); margin-top:2px;}
  .lv .st{font-size:13px; letter-spacing:1px; margin-top:4px; height:16px;}
  .lv.locked{background:#f4f7fc; color:#b3bccd; border-style:dashed; cursor:not-allowed;}
  .lv.cur{border-color:var(--blue); box-shadow:0 0 0 3px rgba(58,122,254,.15);}
  .lv .lockicon{position:absolute; top:6px; right:8px; font-size:12px;}

  /* 对战 */
  .battle-arena{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0;}
  .side{border-radius:16px; padding:12px; text-align:center; border:2px solid var(--line); background:#fff;}
  .side.me{border-color:var(--blue2); background:#f5f9ff;}
  .side.ai{border-color:#ffd58a; background:#fffaf0;}
  .side .who{font-size:13px; font-weight:800; color:var(--sub);}
  .side .tm{font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .side .mv{font-size:12px; color:var(--sub);}
  .vsbar{display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:var(--purple);}
  .diffsel{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0;}
  .diff{border:2px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; cursor:pointer; background:#fff;}
  .diff.on{border-color:var(--purple); background:#f7f2ff;}
  .diff b{display:block; font-size:15px;}
  .diff span{font-size:11.5px; color:var(--sub);}

  /* 感知训练 */
  .sense-q{font-size:19px; font-weight:800; text-align:center; margin:8px 0 4px; line-height:1.5;}
  .sense-q .hl{color:var(--blue);}
  .hotlabel{cursor:pointer;}

  /* 日志 / 徽章 */
  .log{font-size:13.5px; color:var(--sub); line-height:1.7;}
  .log div{border-bottom:1px dashed var(--line); padding:7px 0; display:flex; justify-content:space-between; gap:8px;}
  .badges{display:flex; gap:9px; flex-wrap:wrap;}
  .badge{display:flex; flex-direction:column; align-items:center; gap:3px; padding:11px 8px;
    border-radius:16px; background:#f3f6fc; font-size:12px; font-weight:700; color:var(--sub); min-width:88px;}
  .badge.un{background:#fff8e1; color:#8a6500;}
  .badge.locked{opacity:.42; filter:grayscale(1);}
  .badge .e{font-size:22px;}

  /* toast */
  .toast{position:fixed; left:50%; bottom:calc(var(--tabh) + 20px); transform:translateX(-50%) translateY(10px);
    background:#1f2a3d; color:#fff; padding:11px 18px; border-radius:999px; font-size:14.5px; font-weight:700;
    z-index:200; opacity:0; pointer-events:none; transition:.28s; max-width:88vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* 星级 */
  .stars3{font-size:20px; letter-spacing:2px;}
  .stars3 .off{opacity:.22;}

  /* 大字数字 */
  .huge{font-size:34px; font-weight:900; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}

  @media(max-width:400px){
    :root{--cell:26px;}
    .page{padding:12px 10px 20px;}
    h1{font-size:21px;}
    .gcard .lb{display:none;}
  }

  /* ============ 玩伴 ============ */
  .companion{display:flex; gap:14px; align-items:center;}
  .companion-svg{width:96px; height:96px; flex:0 0 auto; background:linear-gradient(180deg,#f3f8ff,#e9f1ff);
    border-radius:18px; padding:4px;}
  .companion-info{flex:1; min-width:0;}
  .companion-name{font-size:17px; font-weight:900;}
  .companion-name .sub{font-size:12.5px; font-weight:600;}
  .companion-bubble{margin-top:6px; background:#f3f7ff; border:1px solid var(--line);
    border-radius:14px; padding:9px 12px; font-size:14px; line-height:1.6; color:var(--ink);}
  /* ============ 皮肤小屋 ============ */
  .skin-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin:12px 0 18px;}
  .skin-card{border:2px solid var(--line); border-radius:18px; padding:12px 10px; text-align:center;
    background:#fff; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .skin-card.on{border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,.14);}
  .skin-card .skin-sub{font-size:12px; color:var(--sub); font-weight:700; order:-1; margin-bottom:2px;}
  .skin-cube{width:100%; max-width:120px; height:120px;}
  .skin-cube .cube3d{max-width:120px;}
  .skin-comp{width:88px; height:88px;}
  .skin-comp .companion-svg{width:88px; height:88px; background:linear-gradient(180deg,#f3f8ff,#e9f1ff); border-radius:16px; padding:2px;}
  .skin-name{font-weight:900; font-size:14px;}
  .skin-actions{margin-top:2px; min-height:34px; display:flex; align-items:center; justify-content:center;}
  .tag.equipped{color:var(--green); font-weight:800; font-size:13px;}

  /* ============ 进阶路线 ============ */
  .road-head{font-size:17px; font-weight:900; margin-bottom:10px;}
  .road-head .sub{font-size:13px; font-weight:600;}
  .road-list{position:relative;}
  .road-node{display:flex; gap:12px; align-items:flex-start; padding:10px 4px;}
  .road-dot{flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:flex; align-items:center;
